<body>

  <!-- Modal para mensajes -->
<!-- Modal de Bootstrap -->
<div class="modal fade" id="modalMessage" tabindex="-1" role="dialog" aria-labelledby="modalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
      <div class="modal-content">
          <div class="modal-header">
              <h5 class="modal-title" id="modalLabel">Mensaje</h5>

                  <span aria-hidden="true">&times;</span>

  </div>
</div>


  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    // Registro del Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js')
          .then((registration) => {
            console.log('SW registrado exitosamente:', registration);
            
            // Verificar actualizaciones del SW
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // Hay una nueva versión disponible
                  if (confirm('Nueva versión disponible. ¿Recargar para actualizar?')) {
                    window.location.reload();
                  }
                }
              });
            });
          })
          .catch((error) => {
            console.log('Error registrando SW:', error);
          });
      });
    }

    // Manejo del evento beforeinstallprompt (prompt de instalación PWA)
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevenir que Chrome muestre automáticamente el prompt
      e.preventDefault();
      deferredPrompt = e;
      
      // Mostrar botón de instalación personalizado
      showInstallButton();
    });

    function showInstallButton() {
      // Crear botón de instalación dinámico
      const installBtn = document.createElement('button');
      installBtn.innerHTML = 'Instalar App';
      installBtn.className = 'btn btn-primary position-fixed';
      installBtn.style.cssText = 'bottom: 20px; right: 20px; z-index: 1000; border-radius: 25px; padding: 10px 20px; font-weight: bold; box-shadow: 0 4px 8px rgba(0,123,255,0.3);';
      
      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log(`Usuario ${outcome} la instalación`);
          deferredPrompt = null;
          installBtn.remove();
        }
      });
      
      document.body.appendChild(installBtn);
      
      // Ocultar el botón después de 10 segundos si no se usa
      setTimeout(() => {
        if (installBtn.parentNode) {
          installBtn.style.opacity = '0.7';
          setTimeout(() => installBtn.remove(), 5000);
        }
      }, 10000);
    }

    // Detectar cuando la app es instalada
    window.addEventListener('appinstalled', (evt) => {
      console.log('PWA instalada exitosamente');
      // Opcional: mostrar mensaje de bienvenida
      setTimeout(() => {
        if (confirm('App instalada exitosamente! ¿Abrir en modo app?')) {
          window.location.href = window.location.href + '?pwa=true';
        }
      }, 1000);
    });
  </script>

  <!-- Script para manejar el formulario -->
  <script>
    const loginForm = document.getElementById('loginForm');
    const loadingCircle = document.getElementById('loadingCircle');
    const modal = new bootstrap.Modal(document.getElementById('modalMessage'));
    const modalText = document.getElementById('modalText');

    loginForm.addEventListener('submit', function (event) {
      event.preventDefault();

      loadingCircle.style.display = 'block';

      // Crear objeto para enviar datos del formulario
      const formData = new FormData(loginForm);

      fetch(loginForm.action, {
        method: 'POST',
        body: formData
      })
        .then(response => response.json())
        .then(data => {
          loadingCircle.style.display = 'none';
          if (data.success) {
            window.location.href = data.redirect;
          } else {
            mostrarModal(data.message);
          }
        })
        .catch(error => {
          loadingCircle.style.display = 'none';
          mostrarModal('Hubo un error al procesar la solicitud. Inténtalo nuevamente.');
        });
    });

    function mostrarModal(message) {
      modalText.textContent = message;
      modal.show();
    }
  </script>
</body>
</html>
